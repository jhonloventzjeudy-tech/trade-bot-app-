<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Trade Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f1218;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h2 {
            margin: 0;
            font-size: 20px;
            color: #ffffff;
        }
        .header p {
            margin: 2px 0 0;
            font-size: 11px;
            color: #8f9cae;
        }
        .card {
            background: #181d27;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
            margin-bottom: 12px;
            border: 1px solid #28303f;
        }
        .section-title {
            font-size: 11px;
            color: #8f9cae;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .pair-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
            max-height: 160px;
            overflow-y: auto;
        }
        .btn-option {
            background: #212836;
            border: 1px solid #323d52;
            color: #fff;
            padding: 8px 2px;
            border-radius: 6px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-option.active {
            border-color: #ff6b00;
            background: #2a221f;
            color: #ff8c3b;
        }
        .time-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .main-btn {
            background: linear-gradient(90deg, #ff6b00 0%, #ff8800 100%);
            border: none;
            color: #ffffff;
            width: 100%;
            max-width: 360px;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
        }
        .result-box {
            display: none;
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
        .buy { background: #1b382b; color: #00e676; border: 1px solid #00e676; }
        .sell { background: #3a1c24; color: #ff5252; border: 1px solid #ff5252; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Claude Trade Bot</h2>
        <p>mini app - All Markets</p>
    </div>

    <div class="card">
        <div class="section-title">Select Market / Pair</div>
        <div class="pair-grid">
            <div class="btn-option active" onclick="selectPair(this)">EUR/USD</div>
            <div class="btn-option" onclick="selectPair(this)">EUR/USD OTC</div>
            <div class="btn-option" onclick="selectPair(this)">GBP/USD OTC</div>
            <div class="btn-option" onclick="selectPair(this)">EUR/CHF OTC</div>
            <div class="btn-option" onclick="selectPair(this)">EUR/JPY OTC</div>
            <div class="btn-option" onclick="selectPair(this)">AUD/USD OTC</div>
            <div class="btn-option" onclick="selectPair(this)">USD/CAD OTC</div>
            <div class="btn-option" onclick="selectPair(this)">BTC/USDT</div>
            <div class="btn-option" onclick="selectPair(this)">ETH/USDT</div>
        </div>

        <div class="section-title">Trade Time</div>
        <div class="time-grid">
            <div class="btn-option" onclick="selectTime(this)">3 sec</div>
            <div class="btn-option" onclick="selectTime(this)">15 sec</div>
            <div class="btn-option active" onclick="selectTime(this)">1 min</div>
            <div class="btn-option" onclick="selectTime(this)">5 min</div>
        </div>
    </div>

    <button class="main-btn" onclick="getSignal()">⚡ Get signal</button>

    <div id="result" class="result-box"></div>

    <script>
        let selectedPair = "EUR/USD";
        let selectedTime = "1 min";

        function selectPair(el) {
            document.querySelectorAll('.pair-grid .btn-option').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            selectedPair = el.innerText;
        }

        function selectTime(el) {
            document.querySelectorAll('.time-grid .btn-option').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            selectedTime = el.innerText;
        }

        function getSignal() {
            const res = document.getElementById('result');
            res.style.display = 'block';
            res.className = 'result-box';
            res.innerText = "Analyzing market...";
            
            setTimeout(() => {
                const signals = ["CALL (BUY) 🟢", "PUT (SELL) 🔴"];
                const randSignal = signals[Math.floor(Math.random() * signals.length)];
                
                if(randSignal.includes("CALL")) {
                    res.className = 'result-box buy';
                } else {
                    res.className = 'result-box sell';
                }
                res.innerText = `${selectedPair} (${selectedTime}): ${randSignal}`;
            }, 1000);
        }
    </script>
</body>
</html>
