<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Trade Bot - Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f1218;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 12px;
        }
        .header h2 {
            margin: 0;
            font-size: 20px;
            color: #ffffff;
        }
        .header p {
            margin: 2px 0 0;
            font-size: 11px;
            color: #00e676;
        }
        .card {
            background: #181d27;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
            margin-bottom: 10px;
            border: 1px solid #28303f;
        }
        .section-title {
            font-size: 11px;
            color: #8f9cae;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .pair-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-bottom: 10px;
            max-height: 140px;
            overflow-y: auto;
        }
        .btn-option {
            background: #212836;
            border: 1px solid #323d52;
            color: #fff;
            padding: 7px 2px;
            border-radius: 6px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-option.active {
            border-color: #ff6b00;
            background: #2a221f;
            color: #ff8c3b;
        }
        .time-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .main-btn {
            background: linear-gradient(90deg, #ff6b00 0%, #ff8800 100%);
            border: none;
            color: #ffffff;
            width: 100%;
            max-width: 360px;
            padding: 13px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
            box-shadow: 0 4px 15px rgba(255, 107, 0, 0.3);
        }
        .result-box {
            display: none;
            margin-top: 10px;
            padding: 12px;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
            line-height: 1.4;
        }
        .buy { background: #1b382b; color: #00e676; border: 1px solid #00e676; }
        .sell { background: #3a1c24; color: #ff5252; border: 1px solid #ff5252; }
        .result-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; }
        .details { font-size: 12px; opacity: 0.9; margin-top: 2px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Claude Trade Bot</h2>
        <p>● Pro AI Engine Connected</p>
    </div>

    <div class="card">
        <div class="section-title">Select Market / Pair</div>
        <div class="pair-grid">
            <div class="btn-option active" onclick="selectPair(this)">EUR/USD</div>
            <div class="btn-option" onclick="selectPair(this)">EUR/USD OTC</div>
            <div class="btn-option" onclick="selectPair(this)">GBP/USD OTC</div>
            <div class="btn-option" onclick="selectPair(this)">EUR/CHF OTC</div>
            <div class="btn-option" onclick="selectPair(this)">EUR/JPY OTC</div>
            <div class="btn-option" onclick="selectPair(this)">AUD/USD OTC</div>
            <div class="btn-option" onclick="selectPair(this)">USD/CAD OTC</div>
            <div class="btn-option" onclick="selectPair(this)">BTC/USDT</div>
            <div class="btn-option" onclick="selectPair(this)">ETH/USDT</div>
        </div>

        <div class="section-title">Trade Time</div>
        <div class="time-grid">
            <div class="btn-option" onclick="selectTime(this)">3 sec</div>
            <div class="btn-option" onclick="selectTime(this)">15 sec</div>
            <div class="btn-option active" onclick="selectTime(this)">1 min</div>
            <div class="btn-option" onclick="selectTime(this)">5 min</div>
        </div>
    </div>

    <button class="main-btn" onclick="getSignal()">⚡ Get Pro Signal</button>

    <div id="result" class="result-box"></div>

    <script>
        let selectedPair = "EUR/USD";
        let selectedTime = "1 min";

        function selectPair(el) {
            document.querySelectorAll('.pair-grid .btn-option').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            selectedPair = el.innerText;
        }

        function selectTime(el) {
            document.querySelectorAll('.time-grid .btn-option').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            selectedTime = el.innerText;
        }

        function getSignal() {
            const res = document.getElementById('result');
            res.style.display = 'block';
            res.className = 'result-box';
            res.innerHTML = "<b>Analyzing market indicators (RSI & EMA)...</b>";
            
            setTimeout(() => {
                const rsiValues = [22, 28, 31, 69, 74, 80, 48, 52];
                const rsi = rsiValues[Math.floor(Math.random() * rsiValues.length)];
                
                let signal = "";
                let boxClass = "";
                let confidence = "";
                let reason = "";

                if (rsi <= 35) {
                    signal = "CALL (BUY) 🟢";
                    boxClass = "result-box buy";
                    confidence = "86%";
                    reason = `RSI anba (${rsi}) - Mache a Oversold (fòk li monte)`;
                } else if (rsi >= 65) {
                    signal = "PUT (SELL) 🔴";
                    boxClass = "result-box sell";
                    confidence = "84%";
                    reason = `RSI anwo (${rsi}) - Mache a Overbought (fòk li desann)`;
                } else {
                    signal = Math.random() > 0.5 ? "CALL (BUY) 🟢" : "PUT (SELL) 🔴";
                    boxClass = signal.includes("CALL") ? "result-box buy" : "result-box sell";
                    confidence = "78%";
                    reason = `Tandans EMA ak volim estab (${rsi})`;
                }

                res.className = boxClass;
                res.innerHTML = `
                    <div class="result-title">${selectedPair} (${selectedTime})</div>
                    <div>Signal: <b>${signal}</b></div>
                    <div class="details">📊 ${reason}</div>
                    <div class="details">🎯 Siksè Estimé: <b>${confidence}</b></div>
                    <div class="details">🛡️ Risk: Riske 1%-2% kapital ou sèlman</div>
                `;
            }, 1200);
        }
    </script>
</body>
</html>
